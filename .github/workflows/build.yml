
name: Build Recall APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip -q Recall-Android-Project.zip

      - name: Build APK
        run: gradle -p Recall assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Recall-debug-apk
          path: Recall/app/build/outputs/apk/debug/app-debug.apk
          
